    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cmapss-bcde-fast-temp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supersede-old-fast-run:
    runs-on: ubuntu-latest
    steps:
      - name: Supersede obsolete temporary fast run
        run: echo "Superseded by cmapss-bcde-pr-eval seed-11 pilot."
