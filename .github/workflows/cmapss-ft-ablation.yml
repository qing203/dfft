name: cmapss-ft-ablation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        dataset: [FD002, FD004]
        k: [3, 5, 10]
        seed: [11, 22, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn torch

      - name: Run paired Ft ablation
        run: python cmapss_ft_ablation.py --dataset ${{ matrix.dataset }} --k ${{ matrix.k }} --seed ${{ matrix.seed }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft-${{ matrix.dataset }}-K${{ matrix.k }}-s${{ matrix.seed }}
          path: cmapss_ft_results/
          if-no-files-found: warn
