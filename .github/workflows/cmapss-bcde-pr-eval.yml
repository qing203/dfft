name: cmapss-bcde-pr-eval

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cmapss-bcde-pr-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn torch

      - name: Run seed-11 pilot comparison
        run: python cmapss_pilot.py

      - name: Upload pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmapss-pilot-seed11
          path: cmapss_pilot_results/
          if-no-files-found: warn
