name: cmapss-futureops-ablation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn torch

      - name: Run future operating-sequence ablation
        run: python cmapss_futureops_ablation.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmapss-futureops-results
          path: cmapss_futureops_results/
          if-no-files-found: warn
