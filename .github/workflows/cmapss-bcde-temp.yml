name: cmapss-bcde-temp

on:
  pull_request:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn torch

      - name: Run strict comparison
        run: python cmapss_experiment.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmapss-results
          path: cmapss_results/
          if-no-files-found: warn
